name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See docs/SIGNING.md"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle --no-daemon :app:assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Write version.json
        env:
          N: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk all-banks.apk
          SHA=$(sha256sum all-banks.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"https://github.com/%s/releases/download/build-%s/all-banks.apk","sha256":"%s","notes":"%s"}\n' \
            "$N" "$N" "$REPO" "$N" "$SHA" "$(git log -1 --pretty=%s | tr -d '"')" > version.json
          cat version.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: All Banks 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            all-banks.apk
            version.json
